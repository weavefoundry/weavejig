[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/weavejig"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/weavefoundry/weavejig"
publish = false

[workspace.dependencies]
weavejig-syntax = { path = "crates/weavejig-syntax" }
weavejig-formatter = { path = "crates/weavejig-formatter" }
weavejig-linter = { path = "crates/weavejig-linter" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
rowan = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The scoring harness parses and formats whole codebases; unoptimised builds
# make that needlessly slow.
[profile.dev.package.weavejig-syntax]
opt-level = 2
[profile.dev.package.weavejig-formatter]
opt-level = 2
[profile.dev.package.weavejig-linter]
opt-level = 2
[profile.dev.package.rowan]
opt-level = 2
